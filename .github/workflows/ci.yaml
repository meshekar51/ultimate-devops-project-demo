# CI for Product Catalog Service

name: product-catalog-ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: "1.22"

      - name: Build
        working-directory: src/product-catalog
        run: |
          go mod download
          go build -o product-catalog-service main.go

      - name: Unit tests
        working-directory: src/product-catalog
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: "1.22"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          working-directory: src/product-catalog

  docker:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "136283260189"
      AWS_ROLE_ARN: arn:aws:iam::136283260189:role/GitHubECRPushPolicy
      TAG: ${{ github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Prints selected identity claims only.
      # Does not print the OIDC token or AWS credentials.
      - name: Diagnose GitHub OIDC identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          print("Repository:", os.environ["GITHUB_REPOSITORY"], flush=True)
          print("Event:", os.environ["GITHUB_EVENT_NAME"], flush=True)
          print("Ref:", os.environ["GITHUB_REF"], flush=True)
          print("Target IAM role:", os.environ["AWS_ROLE_ARN"], flush=True)

          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")

          if not request_url or not request_token:
              raise SystemExit(
                  "OIDC request variables are missing. "
                  "Check that this job has id-token: write permission."
              )

          separator = "&" if "?" in request_url else "?"
          request_url += separator + "audience=sts.amazonaws.com"

          request = urllib.request.Request(
              request_url,
              headers={"Authorization": "Bearer " + request_token}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              oidc_token = json.load(response)["value"]

          payload = oidc_token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC issuer:", claims.get("iss"), flush=True)
          print("OIDC audience:", claims.get("aud"), flush=True)
          print("OIDC subject:", claims.get("sub"), flush=True)
          print("Repository ID:", claims.get("repository_id"), flush=True)
          print("Owner ID:", claims.get("repository_owner_id"), flush=True)
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions-${{ github.run_id }}
          allowed-account-ids: "136283260189"
          retry-max-attempts: 2

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/product-catalog:${{ env.TAG }}

  updatek8s:
    runs-on: ubuntu-latest
    needs: docker

    # Update main only when this workflow runs on main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: write

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "136283260189"
      TAG: ${{ github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image in Kubernetes deployment manifest
        run: |
          sed -i \
            "s|image: .*|image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/product-catalog:${TAG}|" \
            kubernetes/productcatalog/deploy.yaml

      - name: Commit and push changes
        run: |
          git config user.email "meshekar5@gmail.com"
          git config user.name "Chandrashekar Ganesh"

          git add kubernetes/productcatalog/deploy.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "[CI]: Update product catalog image tag"
            git push origin HEAD:main
          fi
